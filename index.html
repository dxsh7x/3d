<style>
[hidden]{display:none!important}
/* Layout: a full-screen teaching board. Big 3D stage on the left, a tabbed control panel on the right,
   a draggable pen toolbar floating over the stage. On narrow screens the panel drops below the stage. */
:root{
  --bg:#e9edf5; --panel:#ffffff; --panel2:#f3f5fa; --ink:#0f1729; --muted:#566079; --line:#d9deea;
  --accent:#3b36d6; --accent-ink:#ffffff; --accent-soft:#e6e5fb;
  --good:#0e7a56; --good-soft:#d8f4e7; --bad:#b42f2a; --bad-soft:#fde3e1; --warn:#a15100; --warn-soft:#fdecd2;
  --stage-a:#ffffff; --stage-b:#d6deef; --shadow:0 8px 28px rgba(15,23,41,.14);
  --outline:rgba(15,23,41,.55); --chip:rgba(255,255,255,.92);
  --font:'Outfit',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --math:'STIX Two Text','Cambria Math','Times New Roman',serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0f1f; --panel:#141b30; --panel2:#1b2442; --ink:#eef1fb; --muted:#9ba6c4; --line:#2a3558;
  --accent:#8f8bff; --accent-ink:#0a0f1f; --accent-soft:#2b2a6b;
  --good:#4fe0a4; --good-soft:#12382d; --bad:#ff8a84; --bad-soft:#431a19; --warn:#ffb75e; --warn-soft:#3f2a0c;
  --stage-a:#1c2548; --stage-b:#090d1a; --shadow:0 8px 28px rgba(0,0,0,.5);
  --outline:rgba(255,255,255,.4); --chip:rgba(20,27,48,.92); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0f1f; --panel:#141b30; --panel2:#1b2442; --ink:#eef1fb; --muted:#9ba6c4; --line:#2a3558;
  --accent:#8f8bff; --accent-ink:#0a0f1f; --accent-soft:#2b2a6b;
  --good:#4fe0a4; --good-soft:#12382d; --bad:#ff8a84; --bad-soft:#431a19; --warn:#ffb75e; --warn-soft:#3f2a0c;
  --stage-a:#1c2548; --stage-b:#090d1a; --shadow:0 8px 28px rgba(0,0,0,.5);
  --outline:rgba(255,255,255,.4); --chip:rgba(20,27,48,.92); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
button,input,select{touch-action:manipulation}
svg.ic{width:1.35em;height:1.35em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

#app{height:100%;display:grid;grid-template-rows:auto minmax(0,1fr);gap:10px;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-width:0}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:42px;height:42px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.brand h1{font-size:1.3rem;line-height:1.1;margin:0;font-weight:700;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:.82rem;font-weight:500}
.hgroup{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:9px;font-weight:600;min-height:40px;min-width:44px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.hbtn{display:inline-flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:46px;padding:0 14px;font-weight:600}
.hbtn:hover{border-color:var(--accent)}
.hlabel{font-size:.74rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}

main{display:grid;grid-template-columns:minmax(0,1fr) clamp(340px,29vw,430px);gap:12px;min-height:0}
body.focus main{grid-template-columns:minmax(0,1fr)}
body.focus #panel{display:none}

#stage{position:relative;border-radius:20px;overflow:hidden;min-height:0;box-shadow:var(--shadow);
  background:radial-gradient(120% 90% at 50% 20%,var(--stage-a),var(--stage-b));touch-action:none}
#gl,#ink,#laser{position:absolute;inset:0;width:100%;height:100%;display:block}
#gl{touch-action:none;cursor:grab}
#ink{touch-action:none;pointer-events:none}
body.drawing #ink{pointer-events:auto}
body.drawing.t-pen #ink,body.drawing.t-hl #ink,body.drawing.t-line #ink,body.drawing.t-rect #ink,body.drawing.t-ellipse #ink,body.drawing.t-arrow #ink{cursor:crosshair}
body.drawing.t-text #ink{cursor:text}
#laser{pointer-events:none}

.chip{position:absolute;background:var(--chip);border:1px solid var(--line);border-radius:14px;box-shadow:0 4px 16px rgba(0,0,0,.12);backdrop-filter:blur(6px)}
#title{left:14px;top:14px;padding:10px 16px;max-width:min(62%,560px);pointer-events:none}
#title b{display:block;font-size:1.25rem;font-weight:700;letter-spacing:-.01em}
#title span{display:block;font-size:.9rem;color:var(--muted)}
#join{right:14px;top:14px;padding:8px 14px;display:flex;align-items:center;gap:10px;min-width:min(330px,60%)}
#join label{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--muted);white-space:nowrap}
#join input{flex:1;min-width:80px}
#join button{border:0;background:var(--accent);color:var(--accent-ink);border-radius:10px;min-height:42px;padding:0 14px;font-weight:700;white-space:nowrap}
#views{left:14px;top:50%;transform:translateY(-50%);padding:6px;display:flex;flex-direction:column;gap:4px;z-index:5}
#views button{border:0;background:transparent;border-radius:10px;min-height:44px;min-width:48px;padding:0 10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:6px}
#views button:hover,#views button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
#hint{left:50%;transform:translateX(-50%);top:14px;padding:8px 14px;font-size:.9rem;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#hint.show{opacity:1}
@media (max-width:1100px){#title{max-width:48%}}

input[type=range]{-webkit-appearance:none;appearance:none;height:34px;background:transparent;width:100%;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:6px;background:var(--line)}
input[type=range]::-moz-range-track{height:8px;border-radius:6px;background:var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--accent);border:4px solid var(--panel);margin-top:-11px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--accent);border:4px solid var(--panel)}

/* ---------- panel ---------- */
#panel{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0;overflow:hidden}
#tabs{display:grid;grid-template-columns:repeat(5,1fr);border-bottom:1px solid var(--line);background:var(--panel2)}
#tabs button{border:0;background:transparent;padding:10px 2px 9px;font-weight:600;font-size:.88rem;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:60px;color:var(--muted);border-bottom:3px solid transparent}
#tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);background:var(--panel)}
#tabbody{overflow:auto;padding:14px;min-height:0;-webkit-overflow-scrolling:touch;user-select:text;-webkit-user-select:text}
.grp{font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700;margin:14px 0 8px}
.grp:first-child{margin-top:0}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.pcard{border:2px solid var(--line);background:var(--panel2);border-radius:14px;padding:6px 6px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.pcard img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:8px;background:radial-gradient(circle at 50% 35%,var(--panel),var(--panel2));display:block}
.pcard .ph{width:100%;aspect-ratio:1}
.pcard span{font-size:.82rem;font-weight:600;line-height:1.15;text-wrap:balance}
.pcard[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pcard:hover{border-color:var(--accent)}

.prm{background:var(--panel2);border-radius:14px;padding:10px 12px 6px;margin-bottom:10px}
.prm .top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.prm b{font-family:var(--math);font-style:italic;font-size:1.25rem;font-weight:600}
.prm .nm{font-size:.82rem;color:var(--muted);margin-left:6px;font-style:normal;font-family:var(--font)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:46px;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:1.4rem;font-weight:700;line-height:1}
.step button:active{background:var(--accent-soft)}
.step input{width:82px;height:46px;text-align:center;font:inherit;font-weight:700;font-size:1.1rem;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--ink);user-select:text;-webkit-user-select:text}
.step .u{color:var(--muted);font-size:.9rem;min-width:22px}
.bigbtns{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:6px 0 12px}
.btn{min-height:52px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);font-weight:600;padding:6px 10px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.sm{min-height:44px;font-size:.9rem}
.note{font-size:.88rem;color:var(--muted);margin:6px 0 10px;line-height:1.4}

.legend{display:flex;flex-direction:column;gap:6px}
.lrow{display:flex;align-items:center;gap:10px;border:2px solid transparent;background:var(--panel2);border-radius:12px;padding:6px 10px 6px 6px;min-height:54px;text-align:left;width:100%}
.lrow[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.lrow .sw{width:38px;height:38px;border-radius:10px;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);flex:none}
.lrow .tx{flex:1;min-width:0;font-weight:600;font-size:.92rem;line-height:1.2}
.tag{font-size:.74rem;font-weight:700;padding:3px 8px;border-radius:99px;white-space:nowrap}
.tag.y{background:var(--good-soft);color:var(--good)}
.tag.n{background:var(--bad-soft);color:var(--bad)}
.pal{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:10px 0}
.pal button{aspect-ratio:1;border-radius:12px;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line);min-height:36px}
.pal button:active{transform:scale(.92)}
.row2{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=color]{width:52px;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:3px}

.tgl{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border-radius:12px;padding:6px 8px 6px 14px;margin-bottom:8px;min-height:54px;font-weight:600;width:100%;border:0;text-align:left}
.tgl i{width:50px;height:30px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.tgl i::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.tgl[aria-pressed="true"] i{background:var(--accent)}
.tgl[aria-pressed="true"] i::after{transform:translateX(20px)}
.sl{background:var(--panel2);border-radius:12px;padding:8px 14px 4px;margin-bottom:8px}
.sl .top{display:flex;justify-content:space-between;font-weight:600}

/* ---------- formulas ---------- */
.story{background:var(--warn-soft);color:var(--ink);border-radius:14px;padding:12px 14px;line-height:1.45;font-size:.98rem;margin-bottom:10px}
.story b{color:var(--warn)}
.idea{background:var(--accent-soft);border-radius:14px;padding:12px 14px;line-height:1.45;font-size:.93rem;margin-bottom:12px}
.idea b{color:var(--accent)}
.sec{font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--muted);margin:16px 0 8px}
.eqc{background:var(--panel2);border-radius:14px;padding:10px 14px;margin-bottom:8px;font-family:var(--math);font-size:1.12rem}
.eqc .lbl{font-family:var(--font);font-size:.82rem;font-weight:600;color:var(--muted);margin-bottom:4px}
.eqc .ln{padding:1px 0;line-height:1.55}
.eqc .ln.s{color:var(--muted)}
.eqc .ans{font-weight:700;font-size:1.22rem;color:var(--ink);margin-top:2px}
.eqc.tot{background:var(--accent);color:var(--accent-ink)}
.eqc.tot .lbl,.eqc.tot .ln.s,.eqc.tot .ans{color:var(--accent-ink)}
.eqc.len .ans{color:var(--warn)}
.eqc i{font-style:italic}
.eqc sup{font-size:.7em;line-height:0}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;line-height:1.05;margin:0 2px;font-size:.88em}
.fr span:first-child{border-bottom:1.5px solid currentColor;padding:0 2px}
body.quiz .eqc .ans[data-hide="1"]{color:transparent;text-shadow:0 0 10px var(--ink);cursor:pointer;position:relative;min-height:1.6em}
body.quiz .eqc .ans[data-hide="1"]::after{content:"tap to reveal";position:absolute;left:0;top:2px;text-shadow:none;font:600 .85rem var(--font);color:var(--accent-ink);background:var(--accent);padding:3px 10px;border-radius:8px}
body.quiz .eqc.tot .ans[data-hide="1"]{text-shadow:0 0 10px var(--accent-ink)}
body.quiz .eqc.tot .ans[data-hide="1"]::after{background:var(--accent-ink);color:var(--accent)}
.legend-note{font-size:.84rem;color:var(--muted);margin:2px 0 8px}

/* ---------- notes toolbar ---------- */
#tools{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;padding:8px;display:flex;flex-direction:column;gap:6px;max-width:calc(100% - 28px);touch-action:none}
#tools .tr{display:flex;align-items:center;gap:4px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
#tools .tr::-webkit-scrollbar{display:none}
#tools button.tb{border:0;background:transparent;width:50px;height:50px;border-radius:12px;display:inline-grid;place-items:center;flex:none;position:relative}
#tools button.tb svg{width:26px;height:26px}
#tools button.tb:hover{background:var(--accent-soft)}
#tools button.tb[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
#tools button.tb:disabled{opacity:.35}
#tools .sep{width:1px;height:30px;background:var(--line);margin:0 4px;flex:none}
#tools .grab{width:26px;height:50px;display:grid;place-items:center;color:var(--muted);cursor:grab;flex:none}
.col{width:38px;height:38px;border-radius:50%;border:3px solid var(--panel);box-shadow:0 0 0 1px var(--line);flex:none;padding:0}
.col[aria-pressed="true"]{box-shadow:0 0 0 3px var(--accent)}
.wd{width:46px;height:46px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;flex:none}
.wd i{display:block;border-radius:50%;background:currentColor}
.wd[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
#pgno{font-weight:700;min-width:56px;text-align:center;font-variant-numeric:tabular-nums;flex:none}
.pop{position:absolute;bottom:calc(100% + 8px);left:0;padding:8px;display:flex;gap:6px;z-index:8;flex-wrap:wrap;max-width:min(520px,calc(100vw - 40px))}
.pop button{min-height:46px;padding:0 12px;border:1px solid var(--line);background:var(--panel2);border-radius:10px;font-weight:600;white-space:nowrap}
.pop button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#txtin{position:absolute;z-index:7;background:transparent;border:2px dashed var(--accent);border-radius:6px;outline:none;font-family:var(--font);padding:2px 6px;min-width:120px;user-select:text;-webkit-user-select:text}
#toast{position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:20;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s;max-width:80%;text-align:center}
#toast.show{opacity:1}

@media (max-width:900px){
  html,body{height:auto;min-height:100%}
  body{overflow:auto}
  #app{display:flex;flex-direction:column;height:auto;min-height:100dvh}
  header{gap:8px}
  .brand small,.hlabel,.hbtn span{display:none}
  .hbtn{padding:0 12px;min-height:42px}
  main{display:flex;flex-direction:column;height:auto}
  #stage{height:min(72vh,600px);flex:none}
  #panel{height:80vh;flex:none}
  #title{max-width:calc(100% - 28px);padding:8px 12px}
  #title b{font-size:1.05rem}
  #join{min-width:0;left:14px;right:14px;top:70px;padding:6px 10px}
  #views{top:auto;bottom:auto;left:14px;top:128px;transform:none;flex-direction:row}
  #views button{min-width:40px;min-height:40px;padding:0 8px}
  #tools button.tb{width:42px;height:42px}
  #tools button.tb svg{width:22px;height:22px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

</style>
<div id="app">
  <header>
    <div class="brand">
      <div class="logo" id="logo"></div>
      <div><h1>Solids Lab 3D</h1><small>-dxsh</small></div>
    </div>
    <div class="hgroup">
      <span class="hlabel">Value of π</span>
      <div class="seg" id="piSeg" role="group" aria-label="Value of pi"></div>
      <span class="hlabel">Unit</span>
      <div class="seg" id="unitSeg" role="group" aria-label="Unit"></div>
      <button class="hbtn" id="themeBtn" aria-label="Switch light or dark theme"></button>
      <button class="hbtn" id="focusBtn" aria-pressed="false"></button>
      <button class="hbtn" id="fsBtn" aria-label="Full screen"></button>
    </div>
  </header>
  <main>
    <section id="stage" aria-label="3D stage">
      <canvas id="gl"></canvas>
      <canvas id="ink"></canvas>
      <canvas id="laser"></canvas>
      <div class="chip" id="title"><b></b><span></span></div>
      <div class="chip" id="join"><label for="joinR">Join</label><input type="range" id="joinR" min="0" max="100" value="0" aria-label="Join or separate the solids"><label for="joinR">Separate</label><button id="joinBtn"></button></div>
      <div class="chip" id="views"></div>
      <div class="chip" id="tools"></div>
      <div id="toast" role="status"></div>
    </section>
    <aside id="panel">
      <nav id="tabs" role="tablist"></nav>
      <div id="tabbody"></div>
    </aside>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(()=>{
'use strict';
/* ============ helpers ============ */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const fmt=v=>String(+(+v).toFixed(2));
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const pick=a=>a[Math.floor(Math.random()*a.length)];
const ICON={

/* Stack of solids -> definition. Faces that touch each other become "joint" faces (not counted in TSA). */
function stackDef(comps){
  const built=comps.map(compGeo),n=built.length,H=built.reduce((s,b)=>s+b.h,0),Rm=Math.max(...built.map(b=>b.rad));
  const gap=Math.max(2,H*.36); let y=0; const parts=[];
  built.forEach((b,i)=>{
    const c=comps[i],prev=built[i-1],next=built[i+1],nm=c.label;
    const topJoint=b.topFlat&&next&&next.botFlat&&!b.partialTop;
    const botJoint=b.botFlat&&prev&&prev.topFlat;
    const faces=b.faces.map(f=>{
      const joint=(f.name===b.topFlat&&topJoint)||(f.name===b.botFlat&&botJoint);
      return{id:`${i}.${f.name}`,label:`${nm} · ${f.label}`+(joint?' (joined)':''),geo:f.geo,pos:f.pos,color:joint?JOINT:f.color,counted:!joint,joint};
    });
    parts.push({pos:[0,y-H/2,0],ev:[0,(i-(n-1)/2)*gap,0],faces,dims:b.dims});
    y+=b.h;
  });
  const dims=[];
  if(n>1)dims.push(D('H',[-Rm*1.35,-H/2,0],[-Rm*1.35,H/2,0],'H'));
  return{parts,dims,H};
}

/* camera orbit state */
const cam={theta:.62,phi:1.12,dist:30,target:new THREE.Vector3(),fit:10,auto:false};
function applyCam(){const s=Math.sin(cam.phi);
  camera.position.set(cam.target.x+cam.dist*s*Math.sin(cam.theta),cam.target.y+cam.dist*Math.cos(cam.phi),cam.target.z+cam.dist*s*Math.cos(cam.theta));
  camera.lookAt(cam.target);key.position.copy(camera.position).add(new THREE.Vector3(cam.dist*.4,cam.dist*.7,cam.dist*.2));fill.position.copy(camera.position).add(new THREE.Vector3(-cam.dist*.8,-cam.dist*.2,cam.dist*.3));}
const tweens=[];
function tween(ms,fn,done,tag){tweens.push({t0:performance.now(),ms,fn,done,tag})}
const ease=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
function camTo(to,ms=650){for(let i=tweens.length-1;i>=0;i--)if(tweens[i].tag==='cam')tweens.splice(i,1);const f={t:cam.theta,p:cam.phi,d:cam.dist},tt=to.theta!=null?to.theta:f.t,pp=to.phi!=null?to.phi:f.p,dd=to.dist!=null?to.dist:f.d;
  let dt=tt-f.t;dt=Math.atan2(Math.sin(dt),Math.cos(dt));
  tween(ms,e=>{cam.theta=f.t+dt*e;cam.phi=f.p+(pp-f.p)*e;cam.dist=f.d+(dd-f.d)*e},null,'cam')}
function fitDist(){const asp=camera.aspect||1;return cam.fit*1.3/Math.tan(THREE.MathUtils.degToRad(camera.fov/2)*Math.min(1,asp*.95))}

/* ground shadow */

/* ---------- label sprites and dimension lines ---------- */
const DIMCOL={r:'#e11d48',h:'#2563eb',l:'#d97706',a:'#0f766e',R:'#e11d48',H:'#7c3aed'};
function tube(a,b,rad,color){const d=new THREE.Vector3().subVectors(b,a),len=d.length();if(len<1e-6)return null;
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,len,8),new THREE.MeshBasicMaterial({color,depthTest:false,transparent:true,opacity:.95}));
  m.position.copy(a).addScaledVector(d,.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());m.renderOrder=10;return m}
function labelSprite(text,color,h){
  const c=document.createElement('canvas'),x=c.getContext('2d'),font='700 54px Outfit,system-ui,sans-serif';x.font=font;
  const w=Math.ceil(x.measureText(text).width)+44;c.width=w;c.height=92;x.font=font;
  x.fillStyle='rgba(255,255,255,.96)';x.strokeStyle=color;x.lineWidth=6;x.beginPath();
  if(x.roundRect)x.roundRect(4,4,w-8,84,22);else x.rect(4,4,w-8,84);x.fill();x.stroke();
  x.fillStyle=color;x.textBaseline='middle';x.textAlign='center';x.fillText(text,w/2,48);
  const t=new THREE.CanvasTexture(c);t.minFilter=THREE.LinearFilter;
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));
  sp.scale.set(h*w/92,h,1);sp.renderOrder=11;return sp}

/* ---------- build a definition into three.js objects ---------- */
function instantiate(def,ctx,P){
  const root=new THREE.Group(),parts=[],surfaces=[],meshes=[];
  def.parts.forEach((pd,i)=>{
    const g=new THREE.Group(),base=V3(pd.pos||[0,0,0]);g.position.copy(base);
    const part={g,base,ev:V3(pd.ev||[0,0,0]),ghost:!!pd.ghost,mats:[],dimG:null};
    pd.faces.forEach(fc=>{
      if(fc.liquidProxy){surfaces.push({id:fc.id,label:fc.label,counted:true,color:fc.color,noTag:true});return}
      let mat;
      if(fc.ghost){mat=new THREE.MeshStandardMaterial({color:ctx.colorOf(fc.ghostOf,fc.color),transparent:true,opacity:0,roughness:.5,side:THREE.DoubleSide,depthWrite:false});
        mat.userData={ghost:true};(ctx.mats[fc.ghostOf]=ctx.mats[fc.ghostOf]||[]).push(mat);part.mats.push(mat)}
      else{mat=new THREE.MeshStandardMaterial({color:ctx.colorOf(fc.id,fc.color),roughness:.38,metalness:.04,side:THREE.DoubleSide});
        mat.userData={glass:!!fc.glass};(ctx.mats[fc.id]=ctx.mats[fc.id]||[]).push(mat)}
      const m=new THREE.Mesh(fc.geo,mat);m.position.fromArray(fc.pos||[0,0,0]);m.userData={surf:fc.id,ghost:!!fc.ghost};
      if(fc.glass)m.renderOrder=2;
      if(!fc.ghost&&ctx.outline)m.add(new THREE.LineSegments(new THREE.EdgesGeometry(fc.geo,35),LINE));
      g.add(m);meshes.push(m);
      if(!fc.ghost)surfaces.push({id:fc.id,label:fc.label,counted:fc.counted!==false,color:fc.color,joint:!!fc.joint,noTag:!!def.lab});
    });
    if(part.ghost)g.visible=false;
    root.add(g);parts.push(part);
  });
  const res={root,parts,surfaces,meshes,dimGroups:[],globalDim:null};
  const box=new THREE.Box3().setFromObject(root);res.box=box;
  {const sz=box.getSize(new THREE.Vector3());res.fit=Math.max(Math.hypot(sz.x,sz.y,sz.z*.4)/2,1)}
  return res;
}
function addDims(res,def,ctx){
  const fit=res.fit;
  const mk=(d,parent)=>{const a=V3(d.a),b=V3(d.b),col=DIMCOL[d.kind]||'#0f766e',grp=new THREE.Group(),len=a.distanceTo(b);
    const t=tube(a,b,fit*.011,col);if(t)grp.add(t);
    [a,b].forEach(p=>{const s=new THREE.Mesh(new THREE.SphereGeometry(fit*.02,12,8),new THREE.MeshBasicMaterial({color:col,depthTest:false}));s.position.copy(p);s.renderOrder=10;grp.add(s)});
    const mid=a.clone().add(b).multiplyScalar(.5).addScaledVector(V3(d.o||[0,0,0]),fit*.09);
    const sp=labelSprite(ctx.vals?`${d.sym} = ${fmt(len)} ${ctx.unit}`:d.sym,col,fit*.095);sp.position.copy(mid);grp.add(sp);parent.add(grp);return grp};
  def.parts.forEach((pd,i)=>{const grp=new THREE.Group();grp.visible=ctx.dims;res.parts[i].g.add(grp);(pd.dims||[]).forEach(d=>mk(d,grp));res.dimGroups.push(grp)});
  const gg=new THREE.Group();gg.visible=ctx.dims;res.root.add(gg);(def.dims||[]).forEach(d=>mk(d,gg));res.globalDim=gg;
}
function disposeObj(o){o.traverse(n=>{if(n.geometry)n.geometry.dispose();if(n.material){(Array.isArray(n.material)?n.material:[n.material]).forEach(m=>{if(m.map)m.map.dispose();m.dispose()})}})}

/* ---------- current model ---------- */
let cur=null;
function matList(){const out=[];if(cur)Object.values(cur.ctx.mats).forEach(a=>a.forEach(m=>out.push(m)));return out}
function styleAll(){matList().forEach(m=>{const u=m.userData;if(u.ghost)return;
  const base=u.liquid?.88:(u.glass?.26:1),op=u.liquid?base:base*S.opacity;
  m.opacity=op;m.transparent=op<.999;m.depthWrite=!m.transparent;m.wireframe=!!S.wire&&!u.liquid;m.needsUpdate=true});}
const clipPlane=new THREE.Plane(new THREE.Vector3(-1,0,0),0);
function applyClip(){
  if(!S.clip.on){renderer.clippingPlanes=[];return}
  const ax=S.clip.axis,n=new THREE.Vector3(),sgn=S.clip.flip?-1:1;n[ax]=-sgn;
  const bx=cur?cur.res.box:null,half=bx?(bx.max[ax]-bx.min[ax])/2:5,c=bx?(bx.max[ax]+bx.min[ax])/2:0;
  clipPlane.normal.copy(n);clipPlane.constant=sgn*(c+S.clip.pos/100*half);
  // keep points with normal.p + const >= 0  ->  sgn*(c+pos)-sgn*p >= 0
  renderer.clippingPlanes=[clipPlane];
}
function applyExplode(){
  if(!cur)return;const e=S.explode;
  cur.res.parts.forEach(p=>{p.g.position.copy(p.base).addScaledVector(p.ev,e);
    if(p.ghost){p.g.visible=e>.02;p.mats.forEach(m=>{m.opacity=Math.min(.62,e*1.6)})}});
  if(cur.res.globalDim)cur.res.globalDim.visible=S.dims&&e<.04;
}
function updateGround(){const r=cur.res,sz=r.box.getSize(new THREE.Vector3()),span=Math.max(sz.x,sz.z)*2.1+r.fit*.3;
  ground.scale.set(span,span,1);ground.position.set((r.box.min.x+r.box.max.x)/2,r.box.min.y-.03,(r.box.min.z+r.box.max.z)/2)}

function rebuild(opt={}){
  const pr=PR(S.preset),P=S.params[S.preset];
  if(cur){scene.remove(cur.res.root);disposeObj(cur.res.root)}
  const def=pr.stack?stackDef(pr.stack(P)):pr.build(P);
  const ctx={mats:{},colorOf:(id,d)=>(S.colors[S.preset]||{})[id]||d,outline:S.outline,dims:S.dims,vals:S.vals,unit:S.unit};
  const res=instantiate(def,ctx,P);
  if(pr.post)pr.post(res,ctx,P);
  addDims(res,def,ctx);
  scene.add(res.root);
  const prevFit=cur?cur.res.fit:null;
  cur={pr,def,res,ctx};
  styleAll();applyExplode();applyClip();updateGround();
  const ctr=res.box.getCenter(new THREE.Vector3());
  cam.fit=res.fit;
  if(opt.refit||!prevFit||res.fit/prevFit>1.45||res.fit/prevFit<.68){cam.target.copy(ctr);camTo({dist:fitDist()},opt.refit?650:350)}
  else cam.target.copy(ctr);
  if(HK.rebuilt)HK.rebuilt();
}

/* ---------- liquid animation (volume lab) ---------- */
function labTween(target,ms=1300,done){const f={...LAB};tween(ms,e=>{LAB.c=f.c+(target.c-f.c)*e;LAB.m=f.m+(target.m-f.m)*e;LAB.y=f.y+(target.y-f.y)*e;if(cur&&cur.res.lab)cur.res.lab.update(LAB);if(HK.labTick)HK.labTick()},done)}
const CAP={c:1,m:2,y:3};
function labFill(k){const t={...LAB};t[k]=CAP[k];labTween(t,1000)}

/* ---------- pointer: orbit / pan / zoom / pick ---------- */
const ptrs=new Map();let moved=0,downT=0;
function pan(dx,dy){const k=cam.dist*.0016,right=new THREE.Vector3().setFromMatrixColumn(camera.matrix,0),up=new THREE.Vector3().setFromMatrixColumn(camera.matrix,1);
  cam.target.addScaledVector(right,-dx*k).addScaledVector(up,dy*k)}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY,b:e.button});if(ptrs.size===1){moved=0;downT=performance.now()}cv.style.cursor='grabbing'});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(ptrs.size===1){moved+=Math.abs(dx)+Math.abs(dy);if(p.b===2||e.shiftKey)pan(dx,dy);else{cam.theta-=dx*.0085;cam.phi=clamp(cam.phi-dy*.0085,.04,Math.PI-.04)}}
  else if(ptrs.size===2){const o=[...ptrs.entries()].find(([id])=>id!==e.pointerId)[1],d0=Math.hypot(p.x-o.x,p.y-o.y),d1=Math.hypot(e.clientX-o.x,e.clientY-o.y);
    if(d1>0)cam.dist=clamp(cam.dist*d0/d1,cam.fit*.5,cam.fit*14);pan(dx/2,dy/2);moved+=12}
  p.x=e.clientX;p.y=e.clientY});
const endp=e=>{const had=ptrs.size===1&&ptrs.has(e.pointerId);ptrs.delete(e.pointerId);cv.style.cursor='grab';
  if(had&&e.type==='pointerup'&&moved<8&&performance.now()-downT<600)pickAt(e.clientX,e.clientY)};
cv.addEventListener('pointerup',endp);cv.addEventListener('pointercancel',endp);
cv.addEventListener('wheel',e=>{e.preventDefault();cam.dist=clamp(cam.dist*Math.exp(e.deltaY*.0012),cam.fit*.5,cam.fit*14)},{passive:false});
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('dblclick',()=>{camTo({theta:.62,phi:1.12,dist:fitDist()});cam.target.copy(cur.res.box.getCenter(new THREE.Vector3()))});
const ray=new THREE.Raycaster();
function pickAt(cx,cy){const r=cv.getBoundingClientRect(),ndc=new THREE.Vector2((cx-r.left)/r.width*2-1,-((cy-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,camera);
  const list=cur.res.meshes.filter(m=>m.visible&&m.parent.visible&&!m.userData.ghost&&!m.userData.noPick);
  const hits=ray.intersectObjects(list,false);
  let id=null;for(const h of hits){if(S.clip.on&&clipPlane.distanceToPoint(h.point)<0)continue;id=h.object.userData.surf;break}
  if(HK.select)HK.select(id)}

/* ---------- main loop ---------- */
function frame(now){
  requestAnimationFrame(frame);if(document.hidden)return;
  for(let i=tweens.length-1;i>=0;i--){const t=tweens[i],u=Math.min(1,(now-t.t0)/t.ms);t.fn(ease(u));if(u>=1){tweens.splice(i,1);if(t.done)t.done()}}
  if(S.spin&&ptrs.size===0)cam.theta+=.0065;
  applyCam();
  const sel=S.hover||S.selected,pulse=.18+.3*(Math.sin(now/170)+1)/2;
  if(cur)Object.entries(cur.ctx.mats).forEach(([id,list])=>{const on=id===sel;list.forEach(m=>{if(m.emissive){if(on){m.emissive.set(0xffffff);m.emissiveIntensity=pulse}else if(m.emissiveIntensity!==0)m.emissiveIntensity=0}})});
  renderer.render(scene,camera);
}

/* ---------- thumbnails (rendered from the real geometry) ---------- */
function makeThumbs(done){
  let tr;try{tr=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true})}catch(e){return}
  tr.setSize(220,220,false);tr.setPixelRatio(1);tr.localClippingEnabled=true;
  const sc=new THREE.Scene(),cm=new THREE.PerspectiveCamera(36,1,.1,500);
  sc.add(new THREE.AmbientLight(0xffffff,.7));sc.add(new THREE.HemisphereLight(0xffffff,0x8a94b8,.5));const dl=new THREE.DirectionalLight(0xffffff,.9);dl.position.set(5,10,8);sc.add(dl);
  const out={};
  PRESETS.forEach(pr=>{
    const P={};pr.params.forEach(p=>P[p.k]=p.def);
    const def=pr.stack?stackDef(pr.stack(P)):pr.build(P);
    const ctx={mats:{},colorOf:(id,d)=>d,outline:true,dims:false,vals:false,unit:'cm'};
    const res=instantiate(def,ctx,P);if(pr.post)pr.post(res,ctx,P);
    Object.values(ctx.mats).flat().forEach(m=>{const u=m.userData;if(u.glass){m.opacity=.35;m.transparent=true}});
    sc.add(res.root);
    const c=res.box.getCenter(new THREE.Vector3()),d=res.fit*1.32/Math.tan(THREE.MathUtils.degToRad(18));
    cm.position.set(c.x+d*.5,c.y+d*.42,c.z+d*.76);cm.lookAt(c);
    tr.clippingPlanes=[];tr.render(sc,cm);out[pr.id]=tr.domElement.toDataURL('image/png');
    sc.remove(res.root);disposeObj(res.root);
  });
  tr.dispose();try{tr.forceContextLoss()}catch(e){}
  done(out);
}

const FLAT={white:'#ffffff',grid:'#ffffff',dots:'#ffffff',black:'#0e1220',board:'#1f4d3a'};

/* ---------- hit testing for the eraser ---------- */
function segD(px,py,ax,ay,bx,by){const dx=bx-ax,dy=by-ay,l=dx*dx+dy*dy;let t=l?((px-ax)*dx+(py-ay)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-(ax+t*dx),py-(ay+t*dy))}

  if(s.t==='line'||s.t==='arrow')return segD(x,y,s.a[0]*W,s.a[1]*H,s.b[0]*W,s.b[1]*H)<rad+s.w/2;
  if(s.t==='rect'){const x1=s.a[0]*W,y1=s.a[1]*H,x2=s.b[0]*W,y2=s.b[1]*H;return[[x1,y1,x2,y1],[x2,y1,x2,y2],[x2,y2,x1,y2],[x1,y2,x1,y1]].some(e=>segD(x,y,...e)<rad+s.w/2)}
